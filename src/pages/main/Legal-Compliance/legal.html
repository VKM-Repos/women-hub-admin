<script>
  function switchTab(event, tab) {
    const tabs = document.querySelectorAll(".tab-btn");
    tabs.forEach(btn => {
      btn.classList.remove("text-black", "border-b-4", "border-black");
      btn.classList.add("text-gray-500");
    });

    

    const activeBtn = event.currentTarget;
    activeBtn.classList.remove("text-gray-500");
    activeBtn.classList.add("text-black", "border-b-4", "border-black");

    console.log("Active tab:", tab);
  }

  function formatText(command) {
    document.execCommand(command, false, null);
  }

  function previewContent() {
    const content = document.getElementById("editor").innerHTML;
    alert("Preview:\n\n" + content.replace(/<[^>]+>/g, ''));
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];

    if (file) {
      document.getElementById("uploadText").textContent = file.name;

      console.log("Selected file:", file);

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();

        reader.onload = function(e) {
          const preview = document.createElement("img");
          preview.src = e.target.result;
          preview.className = "mt-2 h-20 rounded";

          document.getElementById("uploadText").innerHTML = "";
          document.getElementById("uploadText").appendChild(preview);
        };

        reader.readAsDataURL(file);
      }
    }
  }

  function format(command) {
    document.execCommand(command, false, null);
  }

  // Strikethrough Functions

 const strikeBtn = document.getElementById("strikeBtn");
const editor = document.getElementById("editor");


strikeBtn.addEventListener("mousedown", (e) => {
    e.preventDefault();
});

strikeBtn.addEventListener("click", () => {
    editor.focus(); 

    document.execCommand("strikeThrough", false, null);
});

  //Emoji Picker Functions
  let savedRange;

  function saveSelection() {
    const selection = window.getSelection();
    if (selection.rangeCount > 0) {
      savedRange = selection.getRangeAt(0);
    }
  }

   function insertEmoji(emoji) {
    const editor = document.getElementById("editor");
    editor.focus();

    if (!savedRange) return;
    
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(savedRange);

    if (savedRange) {
      selection.removeAllRanges();
      selection.addRange(savedRange);
    }

   
    const textNode = document.createTextNode(emoji);

    
    savedRange.deleteContents();
    savedRange.insertNode(textNode);

    
    savedRange.setStartAfter(textNode);
    savedRange.setEndAfter(textNode);

    selection.removeAllRanges();
    selection.addRange(savedRange);

    saveSelection();
    console.log("saved");

    document.getElementById("emojiPicker").classList.add("hidden");
  

      function insertEmoji(emoji) {
    const editor = document.getElementById("editor");

    
    editor.focus();

    document.execCommand("insertText", false, emoji);
  }

    document.getElementById("emojiPicker").classList.add("hidden");
  }

   function toggleEmojiPicker() {
    const picker = document.getElementById("emojiPicker");
    picker.classList.toggle("hidden");
  }

  function insertEmoji(emoji) {
    document.execCommand("insertText", false, emoji);

    document.getElementById("emojiPicker").classList.add("hidden");
  }

  document.addEventListener("click", function(e) {
    const picker = document.getElementById("emojiPicker");
    if (!e.target.closest("#emojiPicker") && !e.target.closest("button")) {
      picker.classList.add("hidden");
    }
  });

  function addLink() {
    const url = prompt("Enter URL:");
    if (url) {
      document.execCommand("createLink", false, url);
    }
  }

  const alignSelect = document.getElementById("alignSelect");

alignSelect.addEventListener("change", () => {
    editor.focus();

    const value = alignSelect.value;

    if (value === "left") {
        document.execCommand("justifyLeft");
    } else if (value === "center") {
        document.execCommand("justifyCenter");
    } else if (value === "right") {
        document.execCommand("justifyRight");
    } else if (value === "justify") {
        document.execCommand("justifyFull");
    }
});


function focusEditor() {
  editor.focus();
}
 
function insertImage() {
  focusEditor();
  const url = prompt("Enter image URL:");
  if (url) {
    document.execCommand("insertImage", false, url);
  }
}

function insertVideo() {
  focusEditor();
  let url = prompt("Enter YouTube URL:");
  if (!url) return;

  url = url.replace("watch?v=", "embed/");
  const iframe = `
    <div class="my-4">
      <iframe class="w-full h-64 rounded-lg" src="${url}" frameborder="0" allowfullscreen></iframe>
    </div>
  `;

  document.execCommand("insertHTML", false, iframe);
}

function insertCode() {
  focusEditor();
  const code = prompt("Enter your code:");
  if (code) {
    const formatted = `
      <pre class="bg-gray-900 text-green-400 p-3 rounded-lg overflow-x-auto my-2">
<code>${code}</code></pre>
    `;
    document.execCommand("insertHTML", false, formatted);
  }
}


function formatText(tag) {
  if (!tag) return;

  const selection = window.getSelection();
  if (!selection.rangeCount) return;

  const range = selection.getRangeAt(0);
  const selectedText = range.toString();

  if (!selectedText) return;

  // Create new element (h1, h2, p)
  const newNode = document.createElement(tag);
  newNode.textContent = selectedText;

  range.deleteContents();
  range.insertNode(newNode);

  selection.removeAllRanges();
  const newRange = document.createRange();
  newRange.setStartAfter(newNode);
  selection.addRange(newRange);
}


function askAI() {
  focusEditor();
  const text = prompt("Ask AI:");
  if (text) {
    document.execCommand("insertText", false, "AI: " + text);
  }
}

// Open modal
function openModal() {
  const modal = document.getElementById("modalOverlay");
  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

// Close modal
function closeModal() {
  const modal = document.getElementById("modalOverlay");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

// Confirm action
function confirmAction() {
  alert("Changes saved!");
  closeModal();
}

</script>
